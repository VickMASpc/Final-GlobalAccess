<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalAccess Budget</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div id="app" class="app-shell">
    <header class="app-header" role="banner">
      <div class="app-header__brand" aria-label="GlobalAccess Budget home">
        <span class="brand-mark" aria-hidden="true">GA</span>
        <div>
          <p class="eyebrow">GlobalAccess</p>
          <h1>Budget Workspace</h1>
        </div>
      </div>

      <section class="workspace-status" aria-labelledby="workspace-status-title">
        <h2 id="workspace-status-title" class="sr-only">Workspace sync status</h2>
        <span class="status-dot status-dot--pending" aria-hidden="true"></span>
        <div>
          <p class="workspace-status__label">Workspace</p>
          <p id="workspace-status-text" class="workspace-status__value">Remote datastore not connected yet</p>
        </div>
      </section>
    </header>

    <section class="control-bar" aria-label="Budget controls">
      <div class="field-group">
        <label for="month-selector">Planning month</label>
        <input id="month-selector" name="month-selector" type="month" autocomplete="off">
      </div>
      <p class="control-bar__hint">Static shell ready for Firestore-backed global access.</p>
    </section>

    <nav class="primary-nav" aria-label="Primary navigation">
      <button class="nav-button" type="button" data-view="dashboard" aria-current="page">Dashboard</button>
      <button class="nav-button" type="button" data-view="planner">Planner</button>
      <button class="nav-button" type="button" data-view="expenses">Expenses</button>
      <button class="nav-button" type="button" data-view="cards">Credit Cards</button>
      <button class="nav-button" type="button" data-view="loans">Loans</button>
      <button class="nav-button" type="button" data-view="extract">Extract</button>
      <button class="nav-button" type="button" data-view="settings">Settings</button>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1">
      <section id="view-root" class="view-root" aria-live="polite" aria-busy="false"></section>
    </main>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root" aria-live="assertive"></div>
  <div id="loading-state" class="loading-state" role="status" aria-live="polite" hidden>
    <span class="loading-state__spinner" aria-hidden="true"></span>
    <span>Loading workspace…</span>
  </div>

  <script src="js/core/schema.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/calculations.js"></script>
  <script src="js/core/validators.js"></script>
  <script src="js/core/formatters.js"></script>
  <script src="js/components/emptyState.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/tabs.js"></script>
  <script src="js/services/firebase.js"></script>
  <script src="js/services/sync.js"></script>
  <script src="js/views/dashboardView.js"></script>
  <script src="js/views/plannerView.js"></script>
  <script src="js/views/expensesView.js"></script>
  <script src="js/views/cardsView.js"></script>
  <script src="js/views/loansView.js"></script>
  <script src="js/views/extractView.js"></script>
  <script src="js/views/settingsView.js"></script>
  <script src="js/views/shell.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
